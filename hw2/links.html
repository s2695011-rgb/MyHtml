<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 2-3: Favorite Links</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
        }
        
        /* --- Link States Styling (L-V-H-A Order) --- */
        /* 1. Unvisited link (Normal state) */
        a:link {
            color: #005bac;
            text-decoration: none;
            font-weight: bold;
        }
        /* 2. Visited link (Sites you have already clicked) */
        a:visited {
            color: #6a1b9a;
            text-decoration: none;
        }
        /* 3. Hover state (When mouse is over the link) */
        a:hover {
            color: #d32f2f;
            text-decoration: underline overline; /* Adds lines above and below */
        }
        /* 4. Active state (The exact moment you click the link) */
        a:active {
            color: #388e3c;
        }

        li {
            margin: 15px 0;
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>My Favorite Links Collection</h1>
    <p>Move your mouse over the links or click them to see the CSS state changes.</p>

    <!-- List of useful external links -->
    <ul>

        </li>

        </li>

        </li>
    </ul>

    <!-- Local link back to your menu home page -->
    <a class="back-link" href="menu.html">← Back to Main Menu</a>

</body>
</html>
